server:
  port: 8081

spring:
  application:
    name: payment-management-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/paymentdb}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER:payment_user}
    password: ${POSTGRES_PASSWORD:payment_pass}


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Security: Auth0 Resource Server + M2M client ───────────────────────────
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://dev-iuo6si32jobgnmod.eu.auth0.com/}
          audience: ${AUTH0_AUDIENCE:https://smartlaundry.api}
      client:
        provider:
          auth0:
            token-uri: https://dev-iuo6si32jobgnmod.eu.auth0.com/oauth/token
        registration:
          # M2M client used to call MachineStateService's /api/machines/start-cycle.
          # Reuses the same Auth0 M2M application as spring-bot-manager-only's
          # smartlaundry-m2m registration (already granted sls-machine-start).
          smartlaundry-m2m:
            provider: auth0
            client-id: ${AUTH0_CLIENT_ID:6UGj1BFYTVTUdSC2AklgNsGoXqbCWlGZ}
            client-secret: ${AUTH0_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            scope: sls-machine-start

payment:
  currency: XAF
  timeout-minutes: 5

  pricing:
    short-cycle: 1000
    long-cycle: 2000

  campay:
    base-url: ${CAMPAY_BASE_URL:https://demo.campay.net/api}     # https://www.campay.net/api
    app-key: ${CAMPAY_APP_KEY:} # campay app username
    app-secret: ${CAMPAY_APP_SECRET:} # campay app password
    webhook-secret: ${CAMPAY_WEBHOOK_SECRET:}

  mtn:
    api-url: https://sandbox.momodeveloper.mtn.com
    subscription-key: ${MTN_SUBSCRIPTION_KEY:}
    api-user-id: ${MTN_API_USER_ID:}
    api-key: ${MTN_API_KEY:}
    environment: sandbox

  orange:
    api-url: https://api.orange.com
    client-id: ${ORANGE_CLIENT_ID:}
    client-secret: ${ORANGE_CLIENT_SECRET:}
    merchant-key: ${ORANGE_MERCHANT_KEY:}

machine-state-service:
  base-url: http://localhost:8082

# ── Post-payment machine trigger ──────────────────────────────────────────────
# EQLink is NOT a payment system — it is a machine CONTROL platform.
# This flag controls whether PaymentManagementService automatically calls
# MachineStateService to start the machine after any CamPay/MTN/Orange payment.
# MachineStateService then uses EQLink IoT (if configured) or MQTT.
eqlink:
  auto-start-machine-after-payment: ${EQLINK_AUTO_START:false}

# Logging — levels are configurable via env vars
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.smartlaundromat.payment: ${LOG_LEVEL_PAYMENT:INFO}
    com.smartlaundromat.payment.service: ${LOG_LEVEL_SERVICE:INFO}
    com.smartlaundromat.payment.controller: ${LOG_LEVEL_CONTROLLER:INFO}
    com.smartlaundromat.payment.service.provider: ${LOG_LEVEL_PROVIDER:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%logger{36}] - %msg%n"

auth0:
  audience: ${AUTH0_AUDIENCE:https://smartlaundry.api}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# ── Springdoc / Swagger UI ────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    oauth:
      client-id: ${SWAGGER_CLIENT_ID:}
      client-secret: ${SWAGGER_CLIENT_SECRET:}
  show-actuator: false
